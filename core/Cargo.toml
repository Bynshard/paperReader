[package]
name = "moonlight-core"
version = "0.1.0"
edition = "2021"
description = "Moonlight native core: library, translation jobs, model gateway"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
lopdf = "0.34"
pdf-extract = "0.7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libc = "0.2"
regex = "1"
gag = "1"

[profile.release]
opt-level = 2
lto = "thin"
